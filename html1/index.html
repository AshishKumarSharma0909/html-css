    <script>
        let per = Number(prompt("Enter Your % "));
     
if(per>80 && per<=100){
   document.write("<h2>  Grade A </h2>");
}
else if(per>60 && per<=80){
  document.write("<h2>Grade B </h2>");
}
else if(per>45 && per<=60){
  document.write("<h2>Grade C </h2>");
}
else if(per>33 && per<=45){
   document.write("<h2>Grade D</h2>");
}
else if(per>=0 && per<=33){
document.write("<h2>Fail </h2>");
}
else{
document.write("<h2> invalid %</h2>");
}
    </script>
